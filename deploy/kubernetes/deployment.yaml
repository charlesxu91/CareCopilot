apiVersion: v1
kind: Service
metadata:
  name: carecopilot-backend
  namespace: carecopilot
  labels:
    app: carecopilot-backend
spec:
  selector:
    app: carecopilot-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carecopilot-backend
  namespace: carecopilot
  labels:
    app: carecopilot-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carecopilot-backend
  template:
    metadata:
      labels:
        app: carecopilot-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: carecopilot
          image: carecopilot-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: carecopilot-config
            - secretRef:
                name: carecopilot-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
