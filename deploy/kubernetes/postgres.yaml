apiVersion: v1
kind: Service
metadata:
  name: carecopilot-postgres
  namespace: carecopilot
spec:
  selector:
    app: carecopilot-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carecopilot-postgres
  namespace: carecopilot
spec:
  serviceName: carecopilot-postgres
  replicas: 1
  selector:
    matchLabels:
      app: carecopilot-postgres
  template:
    metadata:
      labels:
        app: carecopilot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: carecopilot
            - name: POSTGRES_USER
              value: carecopilot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carecopilot-secret
                  key: CARECOPILOT_JDBC_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "carecopilot", "-d", "carecopilot"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
