{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
{{- end }}
