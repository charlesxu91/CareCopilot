spring:
  application:
    name: carecopilot-backend

carecopilot:
  store:
    type: jdbc
    jdbc:
      url: ${CARECOPILOT_JDBC_URL}
      username: ${CARECOPILOT_JDBC_USERNAME}
      password: ${CARECOPILOT_JDBC_PASSWORD}
      driver-class-name: ${CARECOPILOT_JDBC_DRIVER:org.postgresql.Driver}
  agentplane:
    base-url: ${CARECOPILOT_AGENTPLANE_BASE_URL:http://agentplane-control-plane:8080}
    connect-timeout-ms: ${CARECOPILOT_AGENTPLANE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CARECOPILOT_AGENTPLANE_READ_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true

server:
  shutdown: graceful
