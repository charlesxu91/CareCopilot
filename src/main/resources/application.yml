spring:
  application:
    name: carecopilot-backend

carecopilot:
  agentplane:
    base-url: ${CARECOPILOT_AGENTPLANE_BASE_URL:http://127.0.0.1:18080}
    connect-timeout-ms: ${CARECOPILOT_AGENTPLANE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CARECOPILOT_AGENTPLANE_READ_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
